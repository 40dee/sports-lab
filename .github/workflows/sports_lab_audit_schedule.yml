name: Sports Lab automatic audit
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-lab-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install app dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install numpy pandas requests streamlit 'psycopg[binary]'
      - name: Grade saved forecasts and update models
        run: |
          test -n "$DATABASE_URL" || { echo 'Missing DATABASE_URL repository secret'; exit 1; }
          python app.py --maintenance
