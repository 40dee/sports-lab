name: Validate model inputs
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/nba-team-stats.yml
  schedule:
    - cron: "17 * * * *"
permissions:
  contents: read
concurrency:
  group: sports-lab-input-checks
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate and save the team's actual projection inputs
        run: python app.py --check-inputs
