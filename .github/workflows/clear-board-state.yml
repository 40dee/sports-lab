name: Temporary Board State Cleanup
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Preview first; delete permanently removes board state"
        required: true
        type: choice
        options:
          - preview
          - delete
        default: preview
      confirmation:
        description: "For delete, enter DELETE_STALE_BOARD_STATE"
        required: false
        type: string
jobs:
  cleanup:
    runs-on: ubuntu-latest
    concurrency:
      group: sports-lab-board-state-cleanup
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install requests
        run: python -m pip install "requests>=2,<3"
      - name: Preview or delete board state
        env:
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          CLEANUP_MODE: ${{ inputs.mode }}
          CLEANUP_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          if [ "$CLEANUP_MODE" = "delete" ]; then
            python scripts/clear_board_state.py --delete --confirm "$CLEANUP_CONFIRMATION"
          else
            python scripts/clear_board_state.py
          fi
