name: Check monthly odds budget and league coverage
on:
  push:
    branches: [main]
    paths: [.github/workflows/odds-budget-check.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-lab-odds-budget-check
  cancel-in-progress: false
jobs:
  quota:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_DAILY_REQUEST_CAP: ${{ vars.ODDSPAPI_DAILY_REQUEST_CAP || '34' }}
      ODDSPAPI_MONTHLY_REQUEST_CAP: ${{ vars.ODDSPAPI_MONTHLY_REQUEST_CAP || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read unmetered account usage and attempt at most one budgeted league probe
        run: python app.py --check-odds-budget
