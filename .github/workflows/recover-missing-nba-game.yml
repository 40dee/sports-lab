name: Recover missing NBA game with one request
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/recover-missing-nba-game.yml]
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: true
jobs:
  recover:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      ODDSPAPI_MONTHLY_REQUEST_CAP: ${{ vars.ODDSPAPI_MONTHLY_REQUEST_CAP || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Recover only Clippers versus Thunder
        run: python scripts/recover_missing_nba_game.py
# Retry only the prior zero-request cooldown failure.
