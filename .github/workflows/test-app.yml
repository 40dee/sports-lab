name: App regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install streamlit pandas numpy requests
      - name: Compile app and run offline regression tests
        run: |
          python -m py_compile app.py
          python -m unittest discover -s tests -v
