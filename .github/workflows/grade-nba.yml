name: Prepare today's NBA board and grade results
on:
  workflow_dispatch:
    inputs:
      refresh:
        description: 'Import current lines (uses provider credits within daily caps)'
        type: boolean
        default: false
  schedule:
    - cron: '0 16,22 * * *'
    - cron: '15,45 * * * *'
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
      REFRESH: ${{ (github.event_name == 'workflow_dispatch' && inputs.refresh) || github.event.schedule == '0 16,22 * * *' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Import or resume today's board
        run: |
          if [ "$REFRESH" = "true" ]; then
            python app.py --auto-board --refresh
          else
            python app.py --auto-board
          fi
      - name: Grade completed games
        if: ${{ !cancelled() }}
        run: python app.py --maintenance
