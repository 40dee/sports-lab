name: Prepare and grade saved NBA forecasts

on:
  workflow_dispatch:
  # Scheduled runs intentionally disabled until transfer usage is verified.

permissions:
  contents: read

concurrency:
  group: nba-maintenance
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Resume requested saved board
        run: python app.py --prepare-saved
      - name: Grade forecasts and review learning
        if: ${{ !cancelled() }}
        run: python app.py --maintenance
