name: Repair detailed regular Fantasy lines with one credit maximum
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/repair-regular-lines.yml
      - scripts/repair_regular_lines.py
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-lab-regular-line-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify actual regular-line directions and rebuild saved slips
        run: python scripts/repair_regular_lines.py
