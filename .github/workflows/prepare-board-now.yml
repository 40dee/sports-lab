name: Prepare NBA board now
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/prepare-board-now.yml
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
      ODDSPAPI_DAILY_REQUEST_CAP: ${{ vars.ODDSPAPI_DAILY_REQUEST_CAP || '34' }}
      ODDSPAPI_MONTHLY_REQUEST_CAP: ${{ vars.ODDSPAPI_MONTHLY_REQUEST_CAP || '' }}
      PRIZEPICKS_DAILY_REQUEST_CAP: ${{ vars.PRIZEPICKS_DAILY_REQUEST_CAP || '10' }}
      REFRESH: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Check fallback configuration without provider requests
        run: python -c "import os; print('THE_ODDS_API_KEY configured for background worker:', bool(os.getenv('THE_ODDS_API_KEY')))"
      - name: Import or resume today's board
        run: |
          if [ "$REFRESH" = "true" ]; then
            python app.py --auto-board --refresh
          else
            python app.py --auto-board --scheduled
          fi
      - name: Grade completed games
        if: ${{ !cancelled() }}
        run: python app.py --maintenance
