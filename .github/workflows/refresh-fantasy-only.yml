name: Refresh Fantasy with four remaining credits
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/refresh-fantasy-only.yml]
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: true
jobs:
  fantasy:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Refresh earliest two Fantasy games and prepare projections
        run: python scripts/refresh_fantasy_only.py
# Retry Fantasy recovery after allocating the four remaining monthly credits.
