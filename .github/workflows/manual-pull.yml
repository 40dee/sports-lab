name: Manual NBA board pull
on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check ledger only or force guarded capture
        type: choice
        options: [pull, check]
        default: pull
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: false
jobs:
  board:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
      ODDSPAPI_DAILY_REQUEST_CAP: ${{ vars.ODDSPAPI_DAILY_REQUEST_CAP || '34' }}
      ODDSPAPI_MONTHLY_REQUEST_CAP: ${{ vars.ODDSPAPI_MONTHLY_REQUEST_CAP || '' }}
      PRIZEPICKS_DAILY_REQUEST_CAP: ${{ vars.PRIZEPICKS_DAILY_REQUEST_CAP || '10' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read today's Turso ledger
        continue-on-error: true
        run: |
          python - <<'PY'
          import os, json, urllib.request
          from datetime import datetime
          from zoneinfo import ZoneInfo
          day = datetime.now(ZoneInfo("America/Los_Angeles")).date().isoformat()
          url = os.environ["TURSO_DATABASE_URL"].replace("libsql://", "https://").rstrip("/") + "/v2/pipeline"
          sql = "SELECT namespace,key,payload,updated FROM sports_records WHERE namespace IN ('automation','board_run','daily_board_capture') AND key = ?"
          body = {"requests":[{"type":"execute","stmt":{"sql":sql,"args":[{"type":"text","value":day}]}},{"type":"close"}]}
          req = urllib.request.Request(url, data=json.dumps(body).encode(), headers={"Authorization":"Bearer "+os.environ["TURSO_AUTH_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req, timeout=30) as response:
              result = json.load(response)["results"][0]
          if result["type"] != "ok":
              raise SystemExit("Ledger query failed")
          rows = result["response"]["result"]["rows"]
          print("Pacific slate:", day, "records:", len(rows))
          for row in rows:
              ns,key,payload,updated = [v.get("value") for v in row]
              data = json.loads(payload)
              fields = ("state","stage","last_run","refreshes","daily_mode","started_at","finished_at","feed_partial","fantasy_partial","odds_requests","feed_requests")
              print(ns, key, updated, json.dumps({k:data[k] for k in fields if k in data}))
          PY
      - name: Force guarded board capture
        if: ${{ inputs.mode == 'pull' && !cancelled() }}
        run: python app.py --auto-board --refresh
