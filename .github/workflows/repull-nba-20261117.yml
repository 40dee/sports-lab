name: One-time requested NBA repull November 17
on:
  push:
    branches: [main]
    paths: [.github/workflows/repull-nba-20261117.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: false
jobs:
  repull:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Repull once, prepare changed quotes and rebuild combos
        run: python scripts/repull_nba_20261117.py
