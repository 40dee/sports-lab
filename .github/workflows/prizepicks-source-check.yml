# Recheck live source capacity on November 11 before any further line downloads.
name: Check PrizePicks source health without downloading lines
on:
  push:
    branches: [main]
    paths: [.github/workflows/prizepicks-source-check.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read zero-credit coverage and source freshness
        run: python app.py --check-prizepicks-source
