name: Inspect saved combo sources without provider requests
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/inspect-saved-combos.yml
      - scripts/inspect_saved_combos.py
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inspect saved lines, sides, and eligibility
        run: python scripts/inspect_saved_combos.py
