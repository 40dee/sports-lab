name: Verify actual learning across saved NBA forecasts
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/check-learning-pipeline.yml]
permissions:
  contents: read
jobs:
  learning:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Audit and evaluate learning from saved final grades only
        run: python scripts/check_learning_pipeline.py

