name: Rebuild recovered Fantasy lines without more provider credits
on:
  push:
    branches: [main]
    paths: [.github/workflows/recover-fantasy-source.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sports-lab-fantasy-recovery
  cancel-in-progress: false
jobs:
  recover-fantasy:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Rebuild saved compact Fantasy response without provider requests
        run: python app.py --rebuild-compact-fantasy
