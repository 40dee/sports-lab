name: Capture requested split NBA board once
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/capture-split-board-once.yml]
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
      PRIZEPICKS_DAILY_REQUEST_CAP: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Capture the disjoint NBA feeds once and prepare saved lines
        run: python scripts/capture_split_board_once.py
