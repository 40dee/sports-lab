name: Diagnose saved combo eligibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-combos.yml
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      PRIZEPICKS_API_KEY: ${{ secrets.PRIZEPICKS_API_KEY }}
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Diagnose saved board without provider calls
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          source=Path('app.py').read_text()
          nodes=[]
          for node in ast.parse(source).body:
              if isinstance(node,ast.If) and "'--rebuild-compact-fantasy'" in (ast.get_source_segment(source,node.test) or ''):break
              nodes.append(node)
          env={'__name__':'sports_lab_diagnostic','__file__':'app.py'}
          exec(compile(ast.Module(body=nodes,type_ignores=[]),'app.py','exec'),env)
          store=env['CompactViewStore'](env['workflow_store'])
          print('ALTERNATE_SOURCE',env['encode'](env['check_prizepicks_source'](store)))
          try:
              account=env['odds_account_snapshot'](store,force=True)
              print('PRIMARY_CAPACITY',env['encode']({k:account.get(k) for k in ('remaining','limit','used','checked_at')}))
          except ValueError as error:print('PRIMARY_CAPACITY_UNAVAILABLE',str(error))
          current=env['combo_clock']()
          board=store.get('board','board') or {}
          print('BOARD_ROWS',len(board.get('v4_rows') or []))
          print('READY_GATE',env['combo_board_ready'](store,current))
          print('RUN_STATE',store.get('board_run',env['slate_day'](current)))
          for mode in ('standard','goblin','demon','mixed'):
              pool,excluded=env['combo_pool'](store,current,tier_mode=mode)
              print('COMBO_POOL',mode,'eligible',len(pool),'excluded',env['encode'](excluded))
          helper=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=='ui_number')
          exec(compile(ast.Module(body=[helper],type_ignores=[]),'app.py','exec'),env)
          for key,value in store.items('source'):
              if key.startswith('the_odds_api_quota:'):print('PROVIDER_BALANCE',env['encode'](value))
          rows=board.get('v4_rows') or []
          records=env['saved_forecast_records'](store,current)
          items=env['current_fantasy_records'](rows,records,{},current)
          from collections import Counter
          reasons=Counter()
          checks=dict(store.items('odds_refresh'))
          for item in items:
              if not item['upcoming']:continue
              card=item['card']
              fresh,detail=env['line_freshness'](card,current,checks)
              reason=detail if not fresh else ('SELECTABLE' if env['pick_is_selectable'](card,item['frozen'].get('result') or {}) else env['pick_side_note'](card,item['frozen'].get('result') or {}))
              reasons[reason]+=1
          print('FANTASY_REASONS',dict(reasons))
          print('FANTASY_RECOVERY',env['encode'](store.get('source','fantasy_only_refresh_latest')))
          samples=[]
          for item in items:
              card=item['card'];result=item['frozen'].get('result') or {}
              if item['upcoming'] and card.get('Platform')=='prizepicks' and card.get('Line Type')=='Standard':
                  fresh,note=env['line_freshness'](card,current,checks)
                  samples.append({'player':card.get('Player'),'game':card.get('Game'),'line':card.get('Line'),'projection':item['projection'],'direction':result.get('direction'),'fresh':fresh,'note':note})
          print('FANTASY_PROJECTIONS',env['encode'](sorted(samples,key=lambda v:(not v['fresh'],v['game'],v['player']))[:30]))

          print('QUOTE_REFRESH',env['encode'](store.get('source','the_odds_api_quote_refresh_latest')))
          for key,value in store.items('quote_refresh'):
              if str(key).startswith(env['slate_day'](current)):print('QUOTE_CHECK',key,env['encode'](value))
          PY
