name: Inspect cached NBA games
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
    steps:
      - name: Read saved provider JSON only
        run: |
          python - <<'PY'
          import os, json, urllib.request
          url = os.environ["TURSO_DATABASE_URL"].replace("libsql://", "https://").rstrip("/") + "/v2/pipeline"
          sql = """SELECT key,payload,updated FROM sports_records
          WHERE namespace='source' AND key LIKE 'the_odds_api_game_v2:%'
          AND ((payload LIKE '%Indiana Pacers%' AND payload LIKE '%Philadelphia 76ers%')
          OR (payload LIKE '%San Antonio Spurs%' AND payload LIKE '%Los Angeles Lakers%'))
          AND payload LIKE '%2026-11-28T%'
          ORDER BY updated DESC"""
          body = {"requests":[{"type":"execute","stmt":{"sql":sql}},{"type":"close"}]}
          req = urllib.request.Request(url,data=json.dumps(body).encode(),headers={"Authorization":"Bearer "+os.environ["TURSO_AUTH_TOKEN"],"Content-Type":"application/json"})
          with urllib.request.urlopen(req,timeout=30) as response:
              result=json.load(response)["results"][0]
          if result["type"]!="ok":
              raise SystemExit("Cache query failed: "+str(result.get("error")))
          rows=result["response"]["result"]["rows"]
          print("Matching cache records:",len(rows))
          for row in rows:
              key,payload,updated=[v.get("value") for v in row]
              print("CACHE KEY:",key,"UPDATED:",updated)
              print(json.dumps(json.loads(payload),indent=2))
          PY
