name: Repair Combos only without odds requests
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/repair-combos-only.yml]
permissions:
  contents: read
concurrency:
  group: sports-lab-worker
  cancel-in-progress: true
jobs:
  combos:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Inspect and rebuild Combos from saved board only
        run: python scripts/repair_combos_only.py
