name: Independently verify NBA improvement
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/workflows/verify-learning-improvement.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
      TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Verify earlier-date training on later outcomes without provider calls or model writes
        run: python scripts/verify_learning_improvement.py

# Recheck independent results after correcting mixed ISO timestamp parsing.
